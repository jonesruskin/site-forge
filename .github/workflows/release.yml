name: Release

# Stages @site-forge/create-site on npm when a version tag is pushed:
#   1. bump packages/cli/package.json "version" (e.g. 0.2.0) and commit
#   2. git tag v0.2.0 && git push origin v0.2.0
#   3. approve the staged version on npmjs.com (Staged Packages) or with
#      `npm stage approve <stage-id>`, using your 2FA. Until then nothing is public.
# Needs the NPM_TOKEN repository secret: a granular token with
# "Read and write (stage only)" on the @site-forge scope. That token cannot
# publish by itself, so a leaked token can't ship a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Tag matches the package version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/cli version $version"
            exit 1
          fi

      - name: Test
        run: pnpm --filter @site-forge/create-site test && pnpm validate

      - name: Build
        run: pnpm --filter @site-forge/create-site build

      # pnpm pack rewrites workspace: dependencies, so the tarball is what users get.
      - name: Pack
        id: pack
        working-directory: packages/cli
        run: echo "tarball=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Smoke test the packed CLI
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "${{ steps.pack.outputs.tarball }}" > /dev/null
          npx --no-install create-site --version
          npx --no-install site --help > /dev/null

      # Staged publishing needs npm 11.15 or newer.
      - name: Stage on npm (goes live only after a maintainer approves with 2FA)
        run: npx --yes npm@^11.15.0 stage publish "${{ steps.pack.outputs.tarball }}" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Staged on npm; available once approved on npmjs.com."
        env:
          GH_TOKEN: ${{ github.token }}
