# docker compose up --build                     → the app on http://localhost:3000
# docker compose --profile database up --build  → plus Postgres, with migrations applied first
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://site:site@db:5432/site}
    ports:
      - "3000:3000"
    restart: unless-stopped

  db:
    profiles: [database]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
      POSTGRES_DB: site
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site"]
      interval: 5s
      retries: 10

  migrate:
    profiles: [database]
    build:
      context: .
      target: build
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgres://site:site@db:5432/site
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
